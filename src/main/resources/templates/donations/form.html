<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head(${pageTitle})}">
  <meta charset="UTF-8"><link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page narrow">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="page-head">
    <div>
      <h1 th:text="${pageTitle}">헌혈 기록 추가</h1>
      <p th:text="${editing} ? '헌혈번호 ' + ${donation.no} + ' 기록을 고칩니다.' : '헌혈증에 적힌 내용을 입력해 주시기 바랍니다.'">헌혈증에 적힌 내용을 입력해 주시기 바랍니다.</p>
    </div>
  </div>

  <form class="card form" method="post"
        th:action="${editing} ? @{/donations/{no}/edit(no=${donation.no})} : @{/donations/new}">
    <label class="field"><span>헌혈한 날</span>
      <input type="date" name="date" th:value="${dateText}" th:max="${today}" required></label>
    <div class="two">
      <label class="field"><span>헌혈 종류</span>
        <select name="type">
          <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == donation.type}">전혈</option>
        </select></label>
      <label class="field"><span>헌혈한 지역</span>
        <select name="region">
          <option th:each="r : ${regions}" th:value="${r}" th:text="${r}" th:selected="${r == donation.region}">서울</option>
        </select></label>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px">
      <a class="btn btn-secondary" th:href="@{/donations}" href="list.html">취소</a>
      <button class="btn btn-primary" type="submit" th:text="${editing} ? '저장하기' : '등록하기'">등록하기</button>
    </div>
  </form>
</main>
</body>
</html>
