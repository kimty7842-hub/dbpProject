<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('로그인')}">
  <meta charset="UTF-8"><link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
<main class="login">
  <div class="card login-card">
    <div class="brand">헌혈플러스</div>
    <h1>로그인</h1>
    <p class="muted">헌혈 기록과 받은 혜택을 확인할 수 있습니다.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form class="form" th:action="@{/login}" method="post">
      <label class="field"><span>아이디</span>
        <input name="id" th:value="${id}" autocomplete="username" required autofocus></label>
      <label class="field"><span>비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-wide" type="submit">로그인</button>
    </form>
    <p class="muted alt">아직 회원이 아니십니까? <a th:href="@{/signup}" href="signup.html">회원가입</a></p>
  </div>
</main>
</body>
</html>
