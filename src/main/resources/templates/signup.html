<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('회원가입')}">
  <meta charset="UTF-8"><link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
<main class="login">
  <div class="card login-card signup-card">
    <div class="brand">헌혈플러스</div>
    <h1>회원가입</h1>
    <p class="muted">가입하면 헌혈 기록과 혜택을 한곳에서 볼 수 있습니다.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <form class="form" th:action="@{/signup}" method="post">
      <label class="field"><span>이름</span>
        <input name="name" th:value="${form.name}" autocomplete="name" maxlength="20" required></label>
      <label class="field"><span>아이디 (영문, 숫자 4~12자)</span>
        <input name="id" th:value="${form.id}" autocomplete="username" maxlength="12" pattern="[A-Za-z0-9]{4,12}" required></label>
      <div class="two">
        <label class="field"><span>비밀번호 (4자 이상)</span>
          <input type="password" name="password" autocomplete="new-password" minlength="4" required></label>
        <label class="field"><span>비밀번호 확인</span>
          <input type="password" name="passwordConfirm" autocomplete="new-password" required></label>
      </div>
      <label class="field"><span>연락처</span>
        <input name="phone" th:value="${form.phone}" placeholder="010-0000-0000" autocomplete="tel" required></label>
      <div class="field"><span>주소</span>
        <div class="addr">
          <select name="city" aria-label="시, 도">
            <option th:each="c : ${cities}" th:value="${c}" th:text="${c}" th:selected="${c == city}">서울특별시</option>
          </select>
          <input name="detail" th:value="${detail}" placeholder="구, 동, 도로명 주소" aria-label="상세 주소" required>
        </div>
      </div>
      <button class="btn btn-primary btn-wide" type="submit">가입하기</button>
    </form>
    <p class="muted alt">이미 회원이십니까? <a th:href="@{/login}" href="login.html">로그인</a></p>
  </div>
</main>
</body>
</html>
