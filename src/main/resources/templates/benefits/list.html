<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('혜택 찾기')}">
  <meta charset="UTF-8"><link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <div class="page-head">
    <div>
      <h1>혜택 찾기</h1>
    </div>
    <!-- ④ CallableStatement 로 저장 프로시저 SP_FIND_ELIGIBLE_BENEFITS 호출 -->
    <a class="btn btn-secondary" th:href="@{/benefits/eligible}" href="#" title="저장 프로시저 SP_FIND_ELIGIBLE_BENEFITS 를 호출합니다">내가 받을 수 있는 혜택 확인</a>
  </div>

  <!-- ③ 조건 검색 -->
  <form class="card" th:action="@{/benefits}" method="get" style="margin-bottom:24px">
    <input type="hidden" name="searched" value="1">
    <div class="filters">
      <label class="field"><span>혜택명</span>
        <input name="keyword" th:value="${q.keyword}" placeholder="혜택 이름으로 검색"></label>
      <label class="field"><span>선물 종류</span>
        <select name="giftType">
          <option value="">전체</option>
          <option th:each="g : ${giftTypes}" th:value="${g}" th:text="${g}" th:selected="${g == q.giftType}">기념품</option>
        </select></label>
      <label class="field"><span>헌혈 종류</span>
        <select name="donationType">
          <option value="">전체</option>
          <option th:each="t : ${donationTypes}" th:value="${t}" th:text="${t}" th:selected="${t == q.donationType}">전혈</option>
        </select></label>
      <label class="field"><span>지역</span>
        <select name="region">
          <option value="">전체</option>
          <option th:each="r : ${regions}" th:value="${r}" th:text="${r}" th:selected="${r == q.region}">서울</option>
        </select></label>
      <button class="btn btn-primary" type="submit">검색</button>
    </div>
    <div class="filters-foot">
      <label class="check"><input type="checkbox" name="openOnly" value="on" th:checked="${openOnly}" checked> 지금 응모할 수 있는 혜택만</label>
    </div>
  </form>

  <div class="split">
    <section>
      <div class="section-title" style="margin-top:0">
        <h2 th:text="${resultTitle}">검색 결과 6건</h2>
        <a th:if="${eligibleMode}" th:href="@{/benefits}" href="#">전체 검색으로 돌아가기</a>
      </div>
      <div class="empty" th:if="${#lists.isEmpty(benefits)}"
           th:text="${eligibleMode} ? '지금 응모 조건을 모두 채운 혜택이 없습니다. 헌혈을 이어 가면 새 혜택이 열립니다.' : '조건에 맞는 혜택이 없습니다. 검색 조건을 바꿔 보시기 바랍니다.'">조건에 맞는 혜택이 없습니다.</div>
      <div class="table-wrap" th:unless="${#lists.isEmpty(benefits)}">
        <table>
          <thead><tr><th>번호</th><th>혜택명</th><th>조건</th><th>응모 기간</th><th>선물 종류</th><th>상태</th></tr></thead>
          <tbody>
          <tr th:each="b, st : ${benefits}" th:classappend="${b.no == selected} ? 'selected'">
            <td class="num" th:text="${b.no}">1</td>
            <td><a class="rowlink" th:text="${b.name}"
                   th:href="${eligibleMode} ? @{/benefits/eligible(no=${b.no})} : @{/benefits(keyword=${q.keyword},giftType=${q.giftType},donationType=${q.donationType},region=${q.region},openOnly=${openFlag},searched=1,no=${b.no})}"
                   href="#">첫 헌혈 환영 선물</a></td>
            <td th:text="${b.conditionText}">헌혈 1회 이상</td>
            <td th:text="${b.periodText}">상시</td>
            <td th:text="${b.giftType}">기념품</td>
            <td class="nowrap" th:text="${statuses[st.index]}">상시</td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ③ 혜택번호로 상세 조회 -->
    <aside class="card detail" th:if="${detail != null}">
      <h2 th:text="${detail.benefit.name}">첫 헌혈 환영 선물</h2>
      <dl class="facts">
        <dt>혜택번호</dt><dd th:text="${detail.benefit.no}">1</dd>
        <dt>조건</dt><dd th:text="${detail.benefit.conditionText}">헌혈 1회 이상</dd>
        <dt>응모 기간</dt><dd th:text="${detail.benefit.periodText}">상시</dd>
        <dt>선물 종류</dt><dd th:text="${detail.benefit.giftType}">기념품</dd>
        <dt>상태</dt><dd th:text="${detail.status}">상시</dd>
      </dl>
      <hr>
      <div class="stat-label">내 진행</div>
      <div class="bar"><i th:style="'width:' + ${detail.percent} + '%'" style="width:100%"></i></div>
      <div th:text="${detail.benefit.targetType != null ? detail.benefit.targetType + ' 헌혈 ' : '헌혈 '} + ${detail.benefit.requiredCount} + '회 중 ' + ${detail.shownCount} + '회'">헌혈 1회 중 1회</div>
      <p class="hint" th:text="${detail.hint}">이미 응모한 혜택입니다.</p>
      <!-- ⑤ 응모: INSERT → 트리거가 조건 검사 -->
      <form th:action="@{/benefits/{no}/apply(no=${detail.benefit.no})}" method="post" onsubmit="return confirm('이 혜택에 응모하시겠습니까?');">
        <input type="hidden" name="back" th:value="${eligibleMode} ? '/benefits/eligible?no=' + ${detail.benefit.no} : '/benefits?no=' + ${detail.benefit.no}">
        <button class="btn btn-primary btn-wide" type="submit" th:disabled="${!detail.canApply}">응모하기</button>
      </form>
    </aside>
  </div>
</main>
</body>
</html>
