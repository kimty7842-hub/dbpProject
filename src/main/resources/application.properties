#### src/main/resources/application.properties

spring.application.name=bloodplus

# ---- 데이터 저장소 선택 (SpringConfig.java 에서 사용)
#  memory       : DB 없이 메모리 데이터로 실행
#  jdbc         : Oracle + 순수 JDBC (PreparedStatement, CallableStatement)
#  jdbctemplate : Oracle + 스프링 JdbcTemplate
app.repository=memory

# ---- Oracle 접속 정보 (jdbc, jdbctemplate 일 때 사용)
#  SID 로 접속:          jdbc:oracle:thin:@localhost:1521:XE
#  서비스 이름으로 접속: jdbc:oracle:thin:@//localhost:1521/XEPDB1   (Oracle 18c, 21c XE 에서 사용자 계정이 PDB 에 있을 때)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=dbp12
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- 개발 편의
spring.thymeleaf.cache=false
server.port=8080
